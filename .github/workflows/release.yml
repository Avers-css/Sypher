name: Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        working-directory: packages/android/android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../../release_artifacts
          cp app/build/outputs/apk/debug/*.apk ../../../release_artifacts/Sypher.apk

      - name: Upload APK to Release v1.0.0
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          files: release_artifacts/Sypher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
