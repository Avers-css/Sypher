appId: org.sypher.desktop
productName: Sypher
copyright: Copyright (c) 2026 Sypher Project Team

directories:
  output: release
  buildResources: build

files:
  - "src/**/*"
  - "node_modules/**/*"
  - "package.json"

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
  icon: src/renderer/assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
  category: Network;InstantMessaging;Chat;Security
  icon: src/renderer/assets/icon.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.social-networking
  icon: src/renderer/assets/icon.icns
